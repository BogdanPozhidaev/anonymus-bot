server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /panel-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
