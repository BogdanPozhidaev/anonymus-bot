services:
  nginx:
    ports: !override
      - "${PANEL_HTTPS_BIND:-0.0.0.0}:${PANEL_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/tls.conf:/etc/nginx/anonymus-tls/panel.conf:ro
      - ./nginx/webhook-disabled.conf:/etc/nginx/anonymus-webhook/endpoint.conf:ro
      - "${TLS_CERT_DIR:?Set TLS_CERT_DIR to the certificate directory}:/etc/nginx/certs:ro"
