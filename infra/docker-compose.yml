x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}

x-postgres-runtime-env: &postgres-runtime-env
  PGHOST: postgres
  POSTGRES_USER: anonymus_runtime
  POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}

x-restricted: &restricted
  read_only: true
  security_opt: [no-new-privileges:true]

x-encryption-env: &encryption-env
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
  PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS:-}
  PII_ENCRYPTION_ACTIVE_VERSION: ${PII_ENCRYPTION_ACTIVE_VERSION:-1}

services:
  postgres:
    <<: *restricted
    image: postgres:15-alpine
    restart: unless-stopped
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev,noexec
      - /var/run/postgresql:size=16m,mode=3775,nosuid,nodev,noexec
    environment: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc "SELECT 1" 2>/dev/null | grep -qx 1']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    <<: *restricted
    cap_drop: [ALL]
    image: redis:7-alpine
    user: redis
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        case "$$REDIS_PASSWORD" in
          ''|*[!A-Za-z0-9_-]*) echo 'REDIS_PASSWORD must use only letters, digits, underscores and hyphens' >&2; exit 1 ;;
        esac
        if [ "$${#REDIS_PASSWORD}" -lt 32 ]; then echo 'REDIS_PASSWORD must contain at least 32 characters' >&2; exit 1; fi
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" | redis-server - --dir /data --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping 2>/dev/null | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *restricted
    cap_drop: [ALL]
    cpus: 1
    mem_limit: 256m
    pids_limit: 64
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["/admin"]
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      PGHOST: postgres
    volumes:
      - ../migrations:/migrations:ro
    networks:
      - internal

  db-permissions:
    <<: *restricted
    image: postgres:15-alpine
    user: postgres
    entrypoint: ["/bin/sh", "/db-permissions.sh"]
    cap_drop: [ALL]
    cpus: 1
    mem_limit: 64m
    pids_limit: 32
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *postgres-env
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD}
    volumes:
      - ./db-permissions.sh:/db-permissions.sh:ro
      - ./db-permissions.sql:/db-permissions.sql:ro
    networks:
      - internal

  media-init:
    <<: *restricted
    image: alpine:3.19
    user: "0:0"
    command: ["/bin/sh", "/media-permissions.sh"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    cpus: 1
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - ./media-permissions.sh:/media-permissions.sh:ro
      - bot_photos:/data/photos
      - bot_voice:/data/voice

  backend:
    <<: *restricted
    cap_drop: [ALL]
    cpus: 2
    mem_limit: 512m
    pids_limit: 128
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-permissions:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    environment:
      <<: [*postgres-runtime-env, *encryption-env]
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      BACKEND_PORT: "8080"
      GIN_MODE: release
      TRUSTED_PROXY_IP: ${AUTH_PROXY_IP:-172.31.247.2}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      MODERATION_DISABLED_RULES: ${MODERATION_DISABLED_RULES:-}
      MODERATION_AUTO_PAUSE: ${MODERATION_AUTO_PAUSE:-false}
      PHOTOS_DIR: /data/photos
      VOICE_DIR: /data/voice
      BOT_INTERNAL_URL: http://bot:9090
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      BOT_INTERNAL_TOKEN_FILE: /run/secrets/bot_internal_token
    secrets:
      - internal_api_token
      - bot_internal_token
    volumes:
      # The backend serves previews and cannot modify published media.
      - bot_photos:/data/photos:ro
      - bot_voice:/data/voice:ro
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 4s
      retries: 5

  bot:
    <<: *restricted
    cap_drop: [ALL]
    cpus: 2
    mem_limit: 768m
    pids_limit: 128
    tmpfs:
      - /tmp:size=128m,mode=1777,nosuid,nodev,noexec
    build:
      context: ../bot
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_UPDATE_MODE: polling
      BACKEND_URL: http://backend:8080
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      BOT_INTERNAL_TOKEN_FILE: /run/secrets/bot_internal_token
      PHOTOS_DIR: /data/photos
      VOICE_DIR: /data/voice
      PANEL_BASE_URL: ${PANEL_BASE_URL:-http://localhost}
      OPERATOR_GROUP_CHAT_ID: ${OPERATOR_GROUP_CHAT_ID:-}
      BOT_ORGANIZATION_NAME: ${BOT_ORGANIZATION_NAME:-}
      BOT_JOINED_TEXT_RU: ${BOT_JOINED_TEXT_RU:-}
      BOT_JOINED_TEXT_EN: ${BOT_JOINED_TEXT_EN:-}
      BOT_REQUEST_RECEIVED_TEXT_RU: ${BOT_REQUEST_RECEIVED_TEXT_RU:-}
      BOT_REQUEST_RECEIVED_TEXT_EN: ${BOT_REQUEST_RECEIVED_TEXT_EN:-}
    secrets:
      - internal_api_token
      - bot_internal_token
    volumes:
      # The bot is the only media publisher.
      - bot_photos:/data/photos
      - bot_voice:/data/voice

    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 4s
      retries: 3

  retention:
    <<: *restricted
    cap_drop: [ALL]
    cpus: 1
    mem_limit: 256m
    pids_limit: 64
    build:
      context: ../backend
      dockerfile: Dockerfile.retention
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-permissions:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    environment:
      <<: [*postgres-runtime-env, *encryption-env]
      PHOTOS_DIR: /data/photos
      VOICE_DIR: /data/voice
      RETENTION_RUN_HOUR: ${RETENTION_RUN_HOUR:-03}
      RETENTION_PII_MONTHS: ${RETENTION_PII_MONTHS:-3}
      RETENTION_MESSAGE_MONTHS: ${RETENTION_MESSAGE_MONTHS:-12}
    volumes:
      # Retention is the only deleter of published media.
      - bot_photos:/data/photos
      - bot_voice:/data/voice
    networks:
      - internal

  panel:
    <<: *restricted
    cap_drop: [ALL]
    cpus: 1
    mem_limit: 128m
    pids_limit: 32
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev,noexec
    build:
      context: ../webpanel
    restart: unless-stopped
    environment:
      PANEL_BOT_USERNAME: ${PANEL_BOT_USERNAME:-}
      PANEL_PRODUCT_NAME: ${PANEL_PRODUCT_NAME:-}
      PANEL_PRIMARY_COLOR: ${PANEL_PRIMARY_COLOR:-blue}
      PANEL_COLOR_SCHEME: ${PANEL_COLOR_SCHEME:-light}
      PANEL_LOGIN_SUBTITLE_RU: ${PANEL_LOGIN_SUBTITLE_RU:-}
      PANEL_LOGIN_SUBTITLE_EN: ${PANEL_LOGIN_SUBTITLE_EN:-}
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/index.html | grep -q /assets/"]
      interval: 5s
      timeout: 4s
      retries: 5

  nginx:
    <<: *restricted
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, KILL, NET_BIND_SERVICE, SETGID, SETUID]
    cpus: 1
    mem_limit: 256m
    pids_limit: 64
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    image: nginx:1.25-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    ports:
      - "${PANEL_HTTP_BIND:-0.0.0.0}:${PANEL_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/routes.conf:/etc/nginx/anonymus/routes.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      panel:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: ${AUTH_PROXY_IP:-172.31.247.2}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health && wget -qO- http://127.0.0.1/index.html | grep -q /assets/"]
      interval: 5s
      timeout: 4s
      retries: 5

networks:
  internal:
    driver: bridge
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${AUTH_PROXY_SUBNET:-172.31.247.0/24}
          ip_range: ${AUTH_PROXY_IP_RANGE:-172.31.247.128/25}

secrets:
  internal_api_token:
    file: ${INTERNAL_API_TOKEN_FILE:?Set INTERNAL_API_TOKEN_FILE to a secret file outside the repository}
  bot_internal_token:
    file: ${BOT_INTERNAL_TOKEN_FILE:?Set BOT_INTERNAL_TOKEN_FILE to a separate secret file outside the repository}

volumes:
  postgres_data:
  redis_data:
  bot_photos:
  bot_voice:
