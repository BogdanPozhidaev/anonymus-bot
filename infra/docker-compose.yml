x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc "SELECT 1" 2>/dev/null | grep -qx 1']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    user: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        case "$$REDIS_PASSWORD" in
          ''|*[!A-Za-z0-9_-]*) echo 'REDIS_PASSWORD must use only letters, digits, underscores and hyphens' >&2; exit 1 ;;
        esac
        if [ "$${#REDIS_PASSWORD}" -lt 32 ]; then echo 'REDIS_PASSWORD must contain at least 32 characters' >&2; exit 1; fi
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" | redis-server -
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping 2>/dev/null | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["/admin"]
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      PGHOST: postgres
    volumes:
      - ../migrations:/migrations:ro
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *postgres-env
      PGHOST: postgres
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      BACKEND_PORT: "8080"
      GIN_MODE: release
      TRUSTED_PROXY_IP: ${AUTH_PROXY_IP:-172.31.247.2}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      MODERATION_DISABLED_RULES: ${MODERATION_DISABLED_RULES:-}
      MODERATION_AUTO_PAUSE: ${MODERATION_AUTO_PAUSE:-false}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Set PII_ENCRYPTION_KEY}
      PHOTOS_DIR: /data/photos
      VOICE_DIR: /data/voice
      BOT_INTERNAL_URL: http://bot:9090
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      BOT_INTERNAL_TOKEN_FILE: /run/secrets/bot_internal_token
    secrets:
      - internal_api_token
      - bot_internal_token
    volumes:
      # The backend serves previews and cannot modify published media.
      - bot_photos:/data/photos:ro
      - bot_voice:/data/voice:ro
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 4s
      retries: 5

  bot:
    build:
      context: ../bot
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKEND_URL: http://backend:8080
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      BOT_INTERNAL_TOKEN_FILE: /run/secrets/bot_internal_token
      REDIS_URL: redis://redis:6379
      PHOTOS_DIR: /data/photos
      VOICE_DIR: /data/voice
      PANEL_BASE_URL: ${PANEL_BASE_URL:-http://localhost}
      OPERATOR_GROUP_CHAT_ID: ${OPERATOR_GROUP_CHAT_ID:-}
    secrets:
      - internal_api_token
      - bot_internal_token
    volumes:
      # The bot is the only media publisher.
      - bot_photos:/data/photos
      - bot_voice:/data/voice

    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 4s
      retries: 3

  retention:
    build:
      context: ../backend
      dockerfile: Dockerfile.retention
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *postgres-env
      PGHOST: postgres
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Set PII_ENCRYPTION_KEY}
      PHOTOS_DIR: /data/photos
      VOICE_DIR: /data/voice
      RETENTION_RUN_HOUR: ${RETENTION_RUN_HOUR:-03}
      RETENTION_PII_MONTHS: ${RETENTION_PII_MONTHS:-3}
      RETENTION_MESSAGE_MONTHS: ${RETENTION_MESSAGE_MONTHS:-12}
    volumes:
      # Retention is the only deleter of published media.
      - bot_photos:/data/photos
      - bot_voice:/data/voice
    networks:
      - internal

  panel:
    build:
      context: ../webpanel
    restart: unless-stopped
    environment:
      PANEL_BOT_USERNAME: ${PANEL_BOT_USERNAME:-}
      PANEL_PRODUCT_NAME: ${PANEL_PRODUCT_NAME:-Панель Посредника}
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/index.html | grep -q /assets/"]
      interval: 5s
      timeout: 4s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${PANEL_HTTP_BIND:-0.0.0.0}:${PANEL_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/routes.conf:/etc/nginx/anonymus/routes.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      panel:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: ${AUTH_PROXY_IP:-172.31.247.2}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health && wget -qO- http://127.0.0.1/index.html | grep -q /assets/"]
      interval: 5s
      timeout: 4s
      retries: 5

networks:
  internal:
    driver: bridge
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${AUTH_PROXY_SUBNET:-172.31.247.0/24}
          ip_range: ${AUTH_PROXY_IP_RANGE:-172.31.247.128/25}

secrets:
  internal_api_token:
    file: ${INTERNAL_API_TOKEN_FILE:?Set INTERNAL_API_TOKEN_FILE to a secret file outside the repository}
  bot_internal_token:
    file: ${BOT_INTERNAL_TOKEN_FILE:?Set BOT_INTERNAL_TOKEN_FILE to a separate secret file outside the repository}

volumes:
  postgres_data:
  bot_photos:
  bot_voice:
