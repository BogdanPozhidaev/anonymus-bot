user nginx;
pid /tmp/nginx.pid;

events {}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=operator_auth:10m rate=10r/s;

    server {
        listen 80;
        location = /telegram/webhook { return 404; }
        include /etc/nginx/anonymus/routes.conf;
    }

    include /etc/nginx/anonymus-tls/*.conf;
}
