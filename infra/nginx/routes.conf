# The bot's 20 MiB limit is enforced on Telegram downloads. Allow room
# for framing when clients send bodies through the reverse proxy.
client_max_body_size 24m;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For "";

set $backend http://backend:8080;
set $panel http://panel:8080;

location = /internal { return 404; }
location ^~ /internal/ { return 404; }
location = /api/internal { return 404; }
location ^~ /api/internal/ { return 404; }
location = /api { return 404; }

location ~ ^/api/auth/(login|totp/verify)$ {
    limit_req zone=operator_auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass $backend;
}

location /api/ {
    proxy_pass $backend;
}

location / {
    proxy_pass $panel;
}
