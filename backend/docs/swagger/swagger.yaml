basePath: /
definitions:
  api.changePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  api.createSessionRequest:
    properties:
      language:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  api.issueRecoveryCodesRequest:
    properties:
      code:
        maxLength: 16
        type: string
      password:
        type: string
    required:
    - code
    - password
    type: object
  api.loginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  api.loginResponse:
    properties:
      pending_token:
        type: string
      session_token:
        type: string
      status:
        description: '"totp_required" | "totp_setup_required" | "ok"'
        type: string
      totp_qr_url:
        type: string
      totp_secret:
        type: string
    type: object
  api.recoverTOTPRequest:
    properties:
      pending_token:
        type: string
      recovery_code:
        maxLength: 64
        type: string
    required:
    - pending_token
    - recovery_code
    type: object
  api.sendAsOperatorRequest:
    properties:
      content:
        type: string
      content_type:
        enum:
        - text
        type: string
      impersonated_role:
        enum:
        - client
        - executor
        type: string
    required:
    - content
    - content_type
    - impersonated_role
    type: object
  api.temporaryPasswordResponse:
    properties:
      id:
        type: integer
      login:
        type: string
      temporary_password:
        type: string
    type: object
  api.updateSessionStatusRequest:
    properties:
      status:
        enum:
        - active
        - paused
        - closed
        type: string
    required:
    - status
    type: object
  api.verifyTOTPRequest:
    properties:
      code:
        type: string
      pending_token:
        type: string
    required:
    - code
    - pending_token
    type: object
  api.verifyTOTPResponse:
    properties:
      operator_id:
        type: integer
      password_change_required:
        type: boolean
      role:
        type: string
      session_token:
        type: string
    type: object
  models.Session:
    properties:
      client_display_name:
        type: string
      client_user_id:
        type: integer
      close_reason:
        type: string
      close_requested_at:
        type: string
      close_requested_by:
        type: integer
      closed_at:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      executor_display_name:
        type: string
      executor_user_id:
        type: integer
      id:
        type: integer
      language:
        type: string
      owner_operator_id:
        type: integer
      payment_status:
        type: string
      status:
        type: string
      title:
        type: string
      user_visible_name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
  description: API for the operator panel and internal bot-to-backend communication
  title: Anonymus Bot Backend API
  version: "1.0"
paths:
  /api/audit-log:
    get:
      description: Supports filtering and CSV export via ?format=csv
      parameters:
      - description: Actor ID
        in: query
        name: actor_id
        type: integer
      - description: Action type
        in: query
        name: action
        type: string
      - description: Target type
        in: query
        name: target_type
        type: string
      - description: json or csv
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List audit events
      tags:
      - audit
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: The first authentication step verifies the username and password
      parameters:
      - description: Username and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.loginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign in as an operator
      tags:
      - auth
  /api/auth/password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Current and new passwords
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.changePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change the signed-in operator's password and revoke existing sessions
      tags:
      - auth
  /api/auth/totp/recover:
    post:
      consumes:
      - application/json
      parameters:
      - description: Password-verified challenge and recovery code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.recoverTOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.loginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exchange a one-time recovery code for a new TOTP enrollment
      tags:
      - auth
  /api/auth/totp/recovery-codes:
    post:
      consumes:
      - application/json
      parameters:
      - description: Current password and TOTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.issueRecoveryCodesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Replace recovery codes after confirming the current password and TOTP
      tags:
      - auth
  /api/auth/totp/verify:
    post:
      consumes:
      - application/json
      description: Successful verification returns a session token for an enrolled
        operator
      parameters:
      - description: Pending token and TOTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.verifyTOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.verifyTOTPResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify a TOTP code
      tags:
      - auth
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Report PostgreSQL and Redis readiness
      tags:
      - health
  /api/incoming-requests:
    get:
      parameters:
      - description: Request status (new or processed)
        in: query
        name: status
        type: string
      - description: Page size (1–200, default 50)
        in: query
        name: limit
        type: integer
      - description: Number of requests to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List incoming requests
      tags:
      - incoming-requests
  /api/operators:
    get:
      description: Available to administrators only
      parameters:
      - description: Page size (1–200, default 50)
        in: query
        name: limit
        type: integer
      - description: Number of operators to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List operators
      tags:
      - operators
  /api/operators/{id}/password/reset:
    post:
      parameters:
      - description: Operator ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.temporaryPasswordResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Issue a temporary password for another operator
      tags:
      - operators
  /api/sessions:
    get:
      description: Administrators see all sessions, operators see sessions they own
      parameters:
      - description: Page size (1–200, default 50)
        in: query
        name: limit
        type: integer
      - description: Number of sessions to skip
        in: query
        name: offset
        type: integer
      - description: Session status
        in: query
        name: status
        type: string
      - description: Title substring or session ID
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List sessions
      tags:
      - sessions
    post:
      consumes:
      - application/json
      parameters:
      - description: Session details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.createSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Session'
      security:
      - BearerAuth: []
      summary: Create a session
      tags:
      - sessions
  /api/sessions/{id}:
    get:
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Session'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a session by ID
      tags:
      - sessions
  /api/sessions/{id}/messages:
    get:
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      - description: Page size (1–200, default 50)
        in: query
        name: limit
        type: integer
      - description: Number of newest messages to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Read a page of session history
      tags:
      - sessions
  /api/sessions/{id}/send-as:
    post:
      consumes:
      - application/json
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      - description: Text and sender role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.sendAsOperatorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Queue a text message on behalf of a session participant
      tags:
      - sessions
  /api/sessions/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.updateSessionStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update session status
      tags:
      - sessions
  /api/sessions/{id}/transcript:
    get:
      description: Owner and administrator access. The export includes message text
        and media captions without attachment files.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: integer
      - description: Export format
        enum:
        - csv
        - pdf
        in: query
        name: format
        required: true
        type: string
      produces:
      - text/csv
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Download a session transcript
      tags:
      - sessions
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer <session_token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
