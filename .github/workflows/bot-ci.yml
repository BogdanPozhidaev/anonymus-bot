name: Bot CI

on:
  push:
    paths:
      - 'bot/**'
      - '.github/workflows/bot-ci.yml'
  pull_request:
    paths:
      - 'bot/**'
      - '.github/workflows/bot-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.1
          working-directory: bot

      - name: Test
        run: go test ./... -race -cover