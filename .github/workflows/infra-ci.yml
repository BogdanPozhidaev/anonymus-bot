name: Infrastructure CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose, container hardening and monitoring
        shell: bash
        env:
          CHECK_MONITORING: "1"
        run: bash infra/check-hardening.sh

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check isolated migration round trip and participant integrity
        run: go test ./tests/repository -run '^Test(AllMigrationsRoundTrip|ParticipantIntegrityMigration)$' -count=1 -v
